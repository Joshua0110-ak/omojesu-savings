{% load core_tags %}
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0A0E0C; margin: 0; padding: 0; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 32px 20px; }
    .card { background: #111812; border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 32px 28px; }
    .brand { font-size: 20px; font-weight: 700; color: #F0EDE6; margin-bottom: 4px; }
    .brand span { color: #C9A84C; }
    .title { font-size: 18px; font-weight: 700; color: #F0EDE6; margin: 20px 0 10px; }
    .body-text { font-size: 14px; color: #b9c2be; line-height: 1.6; }
    .amount { font-size: 26px; font-weight: 700; color: #6ee7b7; margin: 14px 0; }
    .amount.red { color: #fca5a5; }
    .btn {
        display: inline-block; margin-top: 18px; background: linear-gradient(135deg,#22885E,#1A6B4A);
        color: #fff !important; text-decoration: none; padding: 12px 22px; border-radius: 12px; font-size: 14px; font-weight: 600;
    }
    .reason-box {
        background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); border-radius: 10px;
        padding: 12px 16px; font-size: 13px; color: #fca5a5; margin-top: 14px; font-style: italic;
    }
    .footer { font-size: 11px; color: #5c655f; text-align: center; margin-top: 26px; }
</style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <p class="brand">Omo<span>Jesu</span> Savings</p>
        {% block content %}{% endblock %}
    </div>
    <p class="footer">This is an automated message from OmoJesu Savings. Please don't reply to this email.</p>
</div>
</body>
</html>
